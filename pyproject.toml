[project]
name = "uv-mcp-server"
version = "2.0.0"
description = "MCP server that gives AI agents (Claude, Codex, Gemini, OpenCode...) the full uv toolchain: projects, dependencies, Python versions, virtualenvs, tools and diagnostics."
authors = [{ name = "Saadman Rafat", email = "saadman@outlook.com" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["mcp", "uv", "python", "packaging", "virtualenv", "claude", "codex", "ai-agents"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
]
dependencies = [
    "fastmcp>=4.1,<5",
    "pydantic>=2.11,<3",
]

[project.urls]
Homepage = "https://saadman.dev/uv-mcp/"
Documentation = "https://saadman.dev/uv-mcp/"
Repository = "https://github.com/saadmanrafat/uv-mcp"
Issues = "https://github.com/saadmanrafat/uv-mcp/issues"
Changelog = "https://github.com/saadmanrafat/uv-mcp/blob/main/CHANGELOG.md"

[project.scripts]
uv-mcp-server = "uv_mcp.server:main"
uv-mcp = "uv_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uv_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/uv_mcp", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "network: needs access to PyPI / python-build-standalone (deselect with -m 'not network')",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]  # long lines are string literals; `ruff format` handles code

[tool.coverage.run]
source = ["uv_mcp"]
