name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - name: Tool reference is up to date
        run: |
          uv run python scripts/gen_tool_reference.py
          git diff --exit-code docs/src/content/docs/reference/tools.md

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest -v
      - name: Server starts and lists tools
        run: uv run uv-mcp-server --list-tools

  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON manifests parse
        run: |
          for f in gemini-extension.json .mcp.json opencode.json mcp_config_example.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok $f"
          done
      - name: Versions agree
        run: |
          py=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          gem=$(python3 -c "import json;print(json.load(open('gemini-extension.json'))['version'])")
          test "$py" = "$gem" || { echo "pyproject $py != gemini-extension $gem"; exit 1; }

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: python3 scripts/check_docs.py
      - run: npm ci
        working-directory: docs
      - run: npm run build
        working-directory: docs

  release:
    name: Publish to PyPI and GitHub
    runs-on: ubuntu-latest
    needs: [lint, test, validate, docs]
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/uv-mcp-server/
    permissions:
      contents: write
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches package version
        run: |
          version=$(uv version --short)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - run: uv build
      - run: uv publish --trusted-publishing always
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
